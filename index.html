<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Paint the browser UI to match the page instead of flashing white. -->
    <meta name="theme-color" content="#030507" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts: preconnect so the handshake overlaps with parsing, and
         display=swap so text is never invisible while a face downloads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- No portrait preload here on purpose. This document is served for
         every route (SPA rewrite), so an unconditional preload would fetch
         ~94 kB on the eight routes that never show the portrait. The hero
         <img> carries fetchpriority="high" + loading="eager" instead, and it
         lives in the eagerly-imported Home chunk, so the browser discovers
         it almost immediately anyway. -->

    <!-- Per-route title, description, canonical and Open Graph tags are
         rendered by src/components/Seo.tsx. These are the pre-hydration
         defaults, used by crawlers that do not execute JavaScript. -->
    <title>Sandeepkumar S — Web Developer &amp; AI/ML Enthusiast</title>
    <meta
      name="description"
      content="Undergraduate IT student in Coimbatore building for the web and exploring AI/ML. Selected projects, experience and contact."
    />
    <meta name="author" content="Sandeepkumar S" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem 1.5rem; font-family: system-ui, sans-serif; color: #f5f9ff">
        <h1 style="font-size: 1.5rem">Sandeepkumar S</h1>
        <p style="color: #9aa7b4">
          This portfolio needs JavaScript enabled. You can reach me at
          <a href="mailto:sekarsandeep2006@gmail.com" style="color: #00bfff"
            >sekarsandeep2006@gmail.com</a
          >.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
